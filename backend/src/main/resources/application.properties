spring.application.name=kino-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kino}
spring.datasource.username=${DB_USERNAME:kino}
spring.datasource.password=${DB_PASSWORD:kino_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Required: provide a private secret of at least 32 bytes through the environment.
kino.jwt.secret=${JWT_SECRET}
kino.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}