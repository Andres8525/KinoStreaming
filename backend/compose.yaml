services:
  postgres:
    image: postgres:16-alpine
    container_name: kino-postgres
    environment:
      POSTGRES_DB: kino
      POSTGRES_USER: kino
      POSTGRES_PASSWORD: kino_dev_password
    ports:
      - "5432:5432"
    volumes:
      - kino-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kino -d kino"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kino-postgres-data: